{#
WET-style label for a governance status.

status - a choice from the catalogue schema's governance_status field
#}
<span class="label label-{{ status.style }}" title="{{ h.scheming_language_text(status.description) }}">
  <span class="glyphicon {{ status.icon }}" aria-hidden="true"></span>
  {{ h.scheming_language_text(status.label) }}
</span>
