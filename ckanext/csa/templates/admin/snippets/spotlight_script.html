<script>
  (function () {
    function untitled() { return {{ _('Untitled item') | tojson }}; }

    function updateMoveButtons(container) {
      var rows = container.querySelectorAll('.csa-sl-item');
      rows.forEach(function (row, index) {
        row.querySelector('[data-move="up"]').disabled = index === 0;
        row.querySelector('[data-move="down"]').disabled = index === rows.length - 1;
      });
    }

    document.querySelectorAll('.csa-sl-admin [data-repeat]').forEach(updateMoveButtons);

    document.addEventListener('click', function (e) {
      var add = e.target.closest('[data-add]');
      if (add) {
        var key = add.getAttribute('data-add');
        var tmpl = document.getElementById('csa-row-' + key);
        var container = document.querySelector('[data-repeat="' + key + '"]');
        if (tmpl && container) {
          container.appendChild(tmpl.content.cloneNode(true));
          updateMoveButtons(container);
          var rows = container.querySelectorAll('.csa-sl-item');
          var last = rows[rows.length - 1];
          if (last) { var f = last.querySelector('input, textarea'); if (f) { f.focus(); } }
        }
        return;
      }
      var move = e.target.closest('.csa-sl-item__move');
      if (move) {
        var item = move.closest('.csa-sl-item');
        var container = item.parentElement;
        var up = move.getAttribute('data-move') === 'up';
        var sibling = up ? item.previousElementSibling : item.nextElementSibling;
        if (!sibling) { return; }
        if (up) { container.insertBefore(item, sibling); }
        else { container.insertBefore(sibling, item); }
        updateMoveButtons(container);
        var focus = move.disabled
          ? item.querySelector('[data-move="' + (up ? 'down' : 'up') + '"]')
          : move;
        focus.focus();
        var rows = Array.from(container.querySelectorAll('.csa-sl-item'));
        document.querySelector('[data-reorder-status]').textContent =
          {{ _('Item moved to position {position} of {count}.') | tojson }}
            .replace('{position}', rows.indexOf(item) + 1)
            .replace('{count}', rows.length);
        return;
      }
      var rm = e.target.closest('[data-remove]');
      if (rm) {
        var row = rm.closest('.csa-sl-item');
        if (row) {
          var container = row.parentElement;
          row.remove();
          updateMoveButtons(container);
        }
      }
    });

    document.addEventListener('input', function (e) {
      var el = e.target;
      var item = el.closest('.csa-sl-item');
      if (!item) { return; }
      if (el.hasAttribute('data-thumb-src')) {
        var thumb = item.querySelector('[data-thumb]');
        if (thumb) {
          thumb.innerHTML = el.value
            ? '<img src="' + el.value.replace(/"/g, '&quot;') + '" alt="">'
            : '<i class="fa fa-picture-o" aria-hidden="true"></i>';
        }
      }
      if (el.hasAttribute('data-title')) {
        var name = item.querySelector('[data-name]');
        if (name) { name.textContent = el.value || untitled(); }
      }
    });
  })();
</script>
